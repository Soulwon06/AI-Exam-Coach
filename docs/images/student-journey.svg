<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="390" viewBox="0 0 1440 390" role="img" aria-labelledby="title desc">
  <title id="title">AI-Exam-Coach 学生使用路径图</title>
  <desc id="desc">登录后进入课程首页，从推荐或知识点列表进入学习，完成答题后查看反馈，并在错题本或知识点强化中继续。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <style>
      text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#64748b}.head{font-size:18px;font-weight:700}.body{font-size:14px;fill:#526078}.card{fill:white;stroke:#cbd5e1;stroke-width:2;rx:16}.blue{fill:#eff6ff;stroke:#93c5fd}.violet{fill:#f5f3ff;stroke:#c4b5fd}.green{fill:#ecfdf5;stroke:#86efac}.amber{fill:#fffbeb;stroke:#fcd34d}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="390" fill="#f8fafc"/>
  <text x="42" y="48" class="title">学生使用路径</text>
  <text x="42" y="76" class="sub">页面示意图（不是产品截图）；实际页面截图待从演示环境补充</text>
  <g transform="translate(42 125)">
    <rect width="190" height="142" class="card blue"/><text x="20" y="42" class="head">① 登录 / 注册</text><text x="20" y="75" class="body">进入个人学习空间</text><text x="20" y="101" class="body">账号隔离课程与记录</text>
  </g>
  <path d="M238 196H275" class="line"/>
  <g transform="translate(285 125)">
    <rect width="205" height="142" class="card violet"/><text x="20" y="42" class="head">② 课程首页</text><text x="20" y="75" class="body">看考试倒计时与进度</text><text x="20" y="101" class="body">查看今日推荐 / 强化项</text>
  </g>
  <path d="M496 196H533" class="line"/>
  <g transform="translate(543 125)">
    <rect width="205" height="142" class="card amber"/><text x="20" y="42" class="head">③ 选择知识点</text><text x="20" y="75" class="body">排名：按复习优先级</text><text x="20" y="101" class="body">图谱：按章节看结构</text>
  </g>
  <path d="M754 196H791" class="line"/>
  <g transform="translate(801 125)">
    <rect width="205" height="142" class="card blue"/><text x="20" y="42" class="head">④ 学习 / 答题</text><text x="20" y="75" class="body">查看可用讲解与来源</text><text x="20" y="101" class="body">回答可信真题</text>
  </g>
  <path d="M1012 196H1049" class="line"/>
  <g transform="translate(1059 125)">
    <rect width="205" height="142" class="card green"/><text x="20" y="42" class="head">⑤ 答题反馈</text><text x="20" y="75" class="body">看判分、正确答案</text><text x="20" y="101" class="body">更新题目与知识点状态</text>
  </g>
  <path d="M1270 196H1307" class="line"/>
  <g transform="translate(1317 125)">
    <rect width="100" height="142" class="card"/><text x="14" y="42" class="head">⑥ 复习</text><text x="14" y="75" class="body">错题</text><text x="14" y="101" class="body">强化</text>
  </g>
  <text x="42" y="326" class="sub">错题本按“题目”追踪尚未纠正的错题；知识点强化按“知识点状态”列出需要继续练习的单元。</text>
</svg>
